<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Finquity — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--ink:#0a0a0b;--ink-2:#111113;--ink-3:#1c1c1f;--gold:#c9a96e;--gold-light:#e2c99a;--gold-dim:rgba(201,169,110,0.12);--gold-dim2:rgba(201,169,110,0.06);--muted:#6b6b74;--muted-2:#9191a0;--border:rgba(255,255,255,0.07);--border-gold:rgba(201,169,110,0.25);--white:#f5f4f0;--success:#4caf7d;--success-dim:rgba(76,175,125,0.12);--font-display:'Cormorant Garamond',Georgia,serif;--font-body:'DM Sans',sans-serif}
    body{background:var(--ink);color:var(--white);font-family:var(--font-body);font-weight:300;min-height:100vh;display:flex;flex-direction:column;cursor:none}
    .cursor{position:fixed;width:8px;height:8px;background:var(--gold);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:transform .1s}
    .cursor-ring{position:fixed;width:32px;height:32px;border:1px solid rgba(201,169,110,0.4);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:transform .18s,width .2s,height .2s}
    .sidebar{position:fixed;top:0;left:0;bottom:0;width:220px;background:var(--ink-2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:32px 0;z-index:50}
    .sidebar-logo{font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--white);padding:0 28px;margin-bottom:48px;text-decoration:none;letter-spacing:.03em}
    .sidebar-logo span{color:var(--gold)}
    .sidebar-section{font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:0 28px;margin-bottom:10px}
    .nav-item{display:flex;align-items:center;gap:12px;padding:11px 28px;font-size:13px;color:var(--muted-2);text-decoration:none;transition:color .2s,background .2s;border-left:2px solid transparent}
    .nav-item:hover{color:var(--white);background:rgba(255,255,255,0.03)}
    .nav-item.active{color:var(--gold);background:var(--gold-dim2);border-left-color:var(--gold)}
    .nav-item svg{width:15px;height:15px;flex-shrink:0}
    .sidebar-spacer{flex:1}
    .sidebar-user{margin:0 16px;padding:14px 16px;border:1px solid var(--border);border-radius:6px;display:flex;align-items:center;gap:10px}
    .user-avatar{width:28px;height:28px;border-radius:50%;background:var(--gold-dim);border:1px solid var(--border-gold);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:13px;color:var(--gold)}
    .user-name{font-size:12px;color:var(--muted-2)}
    .topbar{position:fixed;top:0;left:220px;right:0;height:64px;background:rgba(10,10,11,0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 48px;z-index:40}
    .topbar-left{display:flex;flex-direction:column;gap:2px}
    .topbar-title{font-size:14px;font-weight:400;color:var(--white)}
    .topbar-sub{font-size:11px;color:var(--muted)}
    .topbar-right{display:flex;align-items:center;gap:12px}
    .btn-import{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:var(--ink);font-family:var(--font-body);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;border:none;border-radius:2px;padding:10px 20px;cursor:pointer;text-decoration:none;transition:background .2s}
    .btn-import:hover{background:var(--gold-light)}
    .main{margin-left:220px;padding-top:64px;flex:1}
    .page-content{padding:52px 48px}

    /* Header entreprise */
    .company-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:48px;opacity:0;animation:fade-up .7s .1s forwards}
    .company-name{font-family:var(--font-display);font-size:42px;font-weight:300;color:var(--white);line-height:1}
    .company-name em{font-style:italic;color:var(--gold)}
    .company-meta{font-size:12px;color:var(--muted);margin-top:6px}
    .company-meta span{color:var(--muted-2)}
    .last-update{font-size:11px;color:var(--muted);text-align:right}

    /* KPIs */
    .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:40px;opacity:0;animation:fade-up .7s .2s forwards}
    .kpi-card{background:var(--ink-2);border:1px solid var(--border);border-radius:8px;padding:20px 22px}
    .kpi-label{font-size:10px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
    .kpi-val{font-size:26px;font-weight:300;color:var(--white);line-height:1;margin-bottom:4px}
    .kpi-val.gold{color:var(--gold)}
    .kpi-val.green{color:var(--success)}
    .kpi-sub{font-size:11px;color:var(--muted)}

    /* Navigation modules */
    .modules-title{font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
    .modules-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;opacity:0;animation:fade-up .7s .3s forwards}
    .module-card{background:var(--ink-2);border:1px solid var(--border);border-radius:8px;padding:28px;text-decoration:none;transition:border-color .2s,background .2s;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
    .module-card:hover{border-color:var(--border-gold);background:var(--gold-dim2)}
    .module-card:hover .module-arrow{opacity:1;transform:translateX(0)}
    .module-icon{width:40px;height:40px;border-radius:6px;background:var(--gold-dim);border:1px solid var(--border-gold);display:flex;align-items:center;justify-content:center}
    .module-icon svg{width:18px;height:18px;color:var(--gold)}
    .module-name{font-family:var(--font-display);font-size:22px;font-weight:400;color:var(--white)}
    .module-desc{font-size:12px;font-weight:300;color:var(--muted-2);line-height:1.7}
    .module-arrow{position:absolute;top:28px;right:28px;font-size:20px;color:var(--gold);opacity:0;transform:translateX(-6px);transition:opacity .2s,transform .2s}
    .module-status{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:2px}
    .status-ready{background:var(--success-dim);color:var(--success);border:1px solid rgba(76,175,125,0.2)}
    .status-pending{background:rgba(255,255,255,0.04);color:var(--muted);border:1px solid var(--border)}

    /* No data state */
    .no-data{text-align:center;padding:80px 40px;opacity:0;animation:fade-up .7s .1s forwards}
    .no-data-title{font-family:var(--font-display);font-size:32px;font-weight:300;color:var(--white);margin-bottom:12px}
    .no-data-title em{font-style:italic;color:var(--gold)}
    .no-data-sub{font-size:14px;color:var(--muted-2);line-height:1.7;margin-bottom:32px}

    @keyframes fade-up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body>
  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <aside class="sidebar">
    <a href="index.html" class="sidebar-logo">Finqui<span>ty</span></a>
    <div class="sidebar-section">Workspace</div>
    <a href="Dashboard.html" class="nav-item active">
      <svg viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1" y="1" width="5" height="5" rx="1"/><rect x="9" y="1" width="5" height="5" rx="1"/><rect x="1" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
      Dashboard
    </a>
    <a href="import.html" class="nav-item">
      <svg viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M7.5 1v9M4 7l3.5 3.5L11 7"/><path d="M2 11v2h11v-2"/></svg>
      Import
    </a>
    <a href="analysis.html" class="nav-item">
      <svg viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M1 11l3-4 3 2 3-5 3 3"/></svg>
      Analyse
    </a>
    <a href="valuation.html" class="nav-item">
      <svg viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="7.5" cy="7.5" r="5.5"/><path d="M7.5 4v3.5l2.5 1.5"/></svg>
      Valorisation
    </a>
    <a href="simulation.html" class="nav-item">
      <svg viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 13l4-6 3 3 4-7"/></svg>
      Simulation LBO
    </a>
    <a href="report.html" class="nav-item">
      <svg viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="1" width="9" height="13" rx="1"/><path d="M5 5h5M5 8h5M5 11h3"/></svg>
      Rapport
    </a>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-user">
      <div class="user-avatar" id="user-avatar">U</div>
      <div class="user-name" id="user-name">—</div>
    </div>
  </aside>

  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-title" id="topbar-title">Dashboard</div>
      <div class="topbar-sub" id="topbar-sub">Chargement…</div>
    </div>
    <div class="topbar-right">
      <a href="import.html" class="btn-import">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 1v7M3 5l3 3 3-3"/><path d="M1 9v2h10V9"/></svg>
        Nouveau fichier
      </a>
    </div>
  </div>

  <div class="main">
    <div class="page-content" id="page-content">
      <!-- contenu injecté par JS -->
    </div>
  </div>

  <script>
    /* ── Cursor ── */
    const cur=document.getElementById('cursor'),ring=document.getElementById('cursorRing');
    let mx=0,my=0,rx=0,ry=0;
    document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
    (function loop(){rx+=(mx-rx)*.12;ry+=(my-ry)*.12;cur.style.left=mx+'px';cur.style.top=my+'px';ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(loop);})();

    /* ── Session + données ── */
    let session={}, store={};
    try{session=JSON.parse(localStorage.getItem('finquity_session')||'{}');}catch(_){}
    try{store=JSON.parse(localStorage.getItem('finquity_data')||'{}');}catch(_){}

    const hasData = store.bilan || store.cr;

    // Afficher infos session
    if(session.name){
      document.getElementById('user-name').textContent=session.name;
      document.getElementById('user-avatar').textContent=session.name[0].toUpperCase();
    }

    const fmt = v => (v||0).toLocaleString('fr-FR',{maximumFractionDigits:0})+' €';
    const pct = v => (v||0).toFixed(1)+'%';

    if(!hasData){
      // ── PAS DE DONNÉES : invitation à importer ──
      document.getElementById('topbar-sub').textContent='Aucune donnée importée';
      document.getElementById('page-content').innerHTML=`
        <div class="no-data">
          <div class="no-data-title">Bienvenue<br><em>${session.name||'sur Finquity'}</em></div>
          <p class="no-data-sub">Importez votre bilan ou compte de résultat<br>pour commencer l'analyse financière.</p>
          <a href="import.html" class="btn-import" style="display:inline-flex;font-size:13px;padding:13px 28px">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 1v9M4 7l3 3 3-3"/><path d="M1 11v2h12v-2"/></svg>
            Importer mes données
          </a>
        </div>`;
    } else {
      // ── DONNÉES PRÉSENTES : hub complet ──
      const b = store.bilan?.fields || {};
      const c = store.cr?.fields    || {};
      const meta = store.meta || {};
      const company = meta.company || 'Entreprise';
      const lastUpdate = store.bilan?.parsedAt || store.cr?.parsedAt || '';
      const dateStr = lastUpdate ? new Date(lastUpdate).toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'}) : '—';

      document.getElementById('topbar-title').textContent = company;
      document.getElementById('topbar-sub').textContent = 'Dernière import : ' + dateStr;

      // Calculs rapides
      const ebitda = c.ebitda || 0;
      const ca     = c.ca     || 0;
      const rn     = c.rn     || 0;
      const margeE = ca ? ebitda/ca*100 : 0;
      const totalActif = (b.immob||0)+(b.actif_circ||0)+(b.treso||0);
      const gearing = b.cp ? (b.dette_lt||0)/b.cp : 0;

      const hasBilan = !!store.bilan;
      const hasCR    = !!store.cr;

      document.getElementById('page-content').innerHTML=`
        <div class="company-header">
          <div>
            <div class="company-name">${company.split(' ')[0]}<br><em>${company.split(' ').slice(1).join(' ')||'&nbsp;'}</em></div>
            <div class="company-meta">Exercice <span>${meta.year||new Date().getFullYear()}</span> · ${meta.sector||'Secteur non renseigné'}</div>
          </div>
          <div class="last-update">Données importées<br>${dateStr}</div>
        </div>

        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-label">Chiffre d'affaires</div>
            <div class="kpi-val gold">${ca?fmt(ca):'—'}</div>
            <div class="kpi-sub">${hasCR?'Compte de résultat':'Non importé'}</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">EBITDA</div>
            <div class="kpi-val ${ebitda>=0?'green':''}">${ebitda?fmt(ebitda):'—'}</div>
            <div class="kpi-sub">${ca?'Marge '+pct(margeE):'—'}</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Total actif</div>
            <div class="kpi-val">${totalActif?fmt(totalActif):'—'}</div>
            <div class="kpi-sub">${hasBilan?'Bilan':'Non importé'}</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Gearing (D/CP)</div>
            <div class="kpi-val">${b.cp?gearing.toFixed(2)+'x':'—'}</div>
            <div class="kpi-sub">${b.dette_lt?fmt(b.dette_lt)+' dettes LT':'—'}</div>
          </div>
        </div>

        <div class="modules-title">Modules d'analyse</div>
        <div class="modules-grid">
          <a href="analysis.html" class="module-card">
            <div class="module-icon"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1 13l4-5 3 2.5 4-6 4 3.5"/></svg></div>
            <div class="module-name">Analyse financière</div>
            <p class="module-desc">Ratios de rentabilité, liquidité, solvabilité. Visualisation avec code couleur.</p>
            <div class="module-status ${hasBilan||hasCR?'status-ready':'status-pending'}">${hasBilan||hasCR?'Données disponibles':'En attente'}</div>
            <div class="module-arrow">→</div>
          </a>
          <a href="valuation.html" class="module-card">
            <div class="module-icon"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="9" cy="9" r="7"/><path d="M9 5v4.5l3 1.5"/></svg></div>
            <div class="module-name">Valorisation</div>
            <p class="module-desc">DCF avec hypothèses paramétrables. Multiples EV/EBITDA, EV/CA. Fourchette de valorisation.</p>
            <div class="module-status ${hasCR?'status-ready':'status-pending'}">${hasCR?'CR disponible':'Nécessite le CR'}</div>
            <div class="module-arrow">→</div>
          </a>
          <a href="simulation.html" class="module-card">
            <div class="module-icon"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 15l5-7 3.5 3.5 5-8"/></svg></div>
            <div class="module-name">Simulation LBO</div>
            <p class="module-desc">Structure de dette, TRI investisseur, MOIC. Tableau d'amortissement complet.</p>
            <div class="module-status ${hasCR?'status-ready':'status-pending'}">${hasCR?'CR disponible':'Nécessite le CR'}</div>
            <div class="module-arrow">→</div>
          </a>
          <a href="report.html" class="module-card">
            <div class="module-icon"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="1" width="12" height="16" rx="1.5"/><path d="M6 6h6M6 9.5h6M6 13h4"/></svg></div>
            <div class="module-name">Rapport PDF</div>
            <p class="module-desc">Synthèse complète avec graphiques, ratios, valorisation et recommandations.</p>
            <div class="module-status status-pending">Bientôt disponible</div>
            <div class="module-arrow">→</div>
          </a>
        </div>`;

      // Ajouter le hover cursor sur les nouvelles cartes
      document.querySelectorAll('.module-card').forEach(el=>{
        el.addEventListener('mouseenter',()=>{ring.style.width='48px';ring.style.height='48px';});
        el.addEventListener('mouseleave',()=>{ring.style.width='32px';ring.style.height='32px';});
      });
    }
  </script>
</body>
</html>
