# Port du serveur : http://localhost:8080
server.port=8080

# Fichier de la base SQLite (créé automatiquement à la racine du projet)
finquity.db.path=finquity.db

# Dossier des scripts Python de l'équipe analytics
finquity.analytics.dir=src/analytics

# Le frontend (src/Frontend) est servi par le même serveur :
# http://localhost:8080/index.html, http://localhost:8080/login.html...
spring.web.resources.static-locations=file:src/Frontend/
